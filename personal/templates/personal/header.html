{% load static %}

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">
            <img class="logo-img" src="{% static 'personal/img/logo/c.png' %}" alt="Bytmos">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item mx-1">
                    <a class="nav-link {% if request.path == '/' or request.path == '/home/' %}active{% endif %}" href="{% url 'home' %}">Home</a>
                </li>
                <li class="nav-item mx-1">
                    <a class="nav-link {% if request.path == '/about/' %}active{% endif %}" href="{% url 'about' %}">About Us</a>
                </li>
                <li class="nav-item mx-1">
                    <a class="nav-link {% if request.path == '/faqs/' %}active{% endif %}" href="{% url 'faqs' %}">FAQs</a>
                </li>
                <li class="nav-item mx-1">
                    <a class="nav-link {% if request.path == '/contact/' %}active{% endif %}" href="{% url 'contact' %}">Contact Us</a>
                </li>
                <li class="nav-item mx-1">
                    <a class="nav-link {% if request.path == '/bytmos_partner/' %}active{% endif %}" href="{% url 'bytmos_partner' %}">Sell on Bytmos</a>
                </li>
                <li class="nav-item mx-1">
                    <a class="nav-link {% if request.path == '/bytmos-partner/' %}active{% endif %}" href="{% url 'blog_home' %}">Tribe</a>
                </li>
                
                {% if user.id == 13 %}
                    <li class="nav-item mx-1">
                        <a class="nav-link {% if request.path == '/post/new/' %}active{% endif %}" href="{% url 'post_create' %}">Create Post</a>
                    </li>
                    <li class="nav-item mx-1">
                        <a class="nav-link {% if request.path == '/featured/new/' %}active{% endif %}" href="{% url 'featured_post_create' %}">Create Featured Post</a>
                    </li>
                {% endif %}

                {% if request.user.is_authenticated %}
                    <li class="nav-item mx-1">
                        <a class="nav-link {% if request.path == '/logout/' %}active{% endif %}" href="{% url 'logout_user' %}">Logout</a>
                    </li>
                {% else %}
                    <li class="nav-item mx-1">
                        <a class="nav-link {% if request.path == '/register/' %}active{% endif %}" href="{% url 'register' %}">Signup</a>
                    </li>
                    <li class="nav-item mx-1">
                        <a class="nav-link {% if request.path == '/login/' %}active{% endif %}" href="{% url 'login' %}">Login</a>
                    </li>
                {% endif %}
                
                <li class="nav-item ms-2">
                    <a class="btn btn-gradient text-white px-4" href="#footer">Download</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

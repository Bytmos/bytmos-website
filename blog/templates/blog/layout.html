<!DOCTYPE html>
{% load social_share %}
{% load static %}
<html lang="en" style="font-family: Montserrat, sans-serif !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bytmos App - Professional Services Without Borders</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type='text/css' href="{% static 'personal/css/main.css' %}">
    <link rel="shortcut icon" href="{%static 'personal/img/logo/favicon.png' %}" type="image/x-icon">
	<link rel="icon" href="{%static 'personal/img/logo/favicon.png' %}" type="image/x-icon">
    {% block extra_css_files %}{% endblock %}

</head>
<body>
    {% include "blog/header.html" %}

    {% block content %} {% endblock %}

   
    {% include "personal/footer.html" %}

    <script src="{% static 'personal/js/jquery.min.js' %}"></script>
    <script src="{% static 'personal/bootstrap/js/bootstrap.min.js' %}"></script>

    <script src="https://cdn.tiny.cloud/1/no-api-key/tinymce/5/tinymce.min.js" referrerpolicy="origin"></script>
    <script>
        tinymce.init({
            selector: '#advanced-textarea'
        });
    </script>

</body>
</html>

{% extends "personal/layout.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}Create Blog Post | New{% endblock %}

{% block content %}
<!-- Page Header -->
<br>

<main class="">
        <!-- Render your registration form here -->
      <div class="col-lg-6 offset-lg-3">
            <div class="site-heading">
              <h2>Create a Post</h2><br>
            </div>
          <div class="create-blog">
            <form method="POST">
                  {% csrf_token %}
                    {{ form|crispy }}
                  {{form.media}}
                <div class="d-grid gap-2">
                  <button class="post-button" type="submit">Post</button>
                </div>
            </form>
          </div>
      </div><br>
</main>
{% endblock %}
